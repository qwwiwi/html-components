<style>
/* tokens + base, scoped to this component only */
.hc-kpi-ratio-root{--bg:#FAF8F2;--paper:#FFFEFA;--line:#D8D7C9;--ink:#24251E;--soft:#4F5147;--muted:#5C6053;
--lime:#D4FF00;--dark:#15150F;--grey:#8A8D7E;--sand:#E9E7DA;--sand2:#C9C8B8;
--sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
.hc-kpi-ratio-root,.hc-kpi-ratio-root *{box-sizing:border-box}
.hc-kpi-ratio-root{font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;min-width:0}
.hc-kpi-ratio-root *{min-width:0}
.hc-kpi-ratio-root svg{max-width:100%;height:auto}
.hc-kpi-ratio-root .mono{font-family:var(--mono)}
.hc-kpi-ratio-root .eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hc-kpi-ratio-root mark,.hc-kpi-ratio-root .hl{background:linear-gradient(transparent 62%,var(--lime) 62%);color:inherit;padding:0 2px}
.hc-kpi-ratio-root .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(10,10,10,.06);padding:24px}
.hc-kpi-ratio-root .card.dark{background:var(--dark);border-color:var(--dark);color:var(--bg);box-shadow:0 14px 40px rgba(10,10,10,.18)}
.hc-kpi-ratio-root .card.dark .eyebrow{color:#C9C7B8}
.hc-kpi-ratio-root .tag{display:inline-block;background:var(--lime);color:var(--ink);font:600 11px/1 var(--mono);letter-spacing:.05em;padding:6px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.hc-kpi-ratio-root .tag.line{background:transparent;border:1px solid var(--grey);color:var(--soft)}
.hc-kpi-ratio-root .tag.dk{background:var(--ink);color:var(--lime)}
.hc-kpi-ratio-root .num{font-weight:800;letter-spacing:-.04em;line-height:.95}
.hc-kpi-ratio-root .h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hc-kpi-ratio-root .h3{font-size:clamp(18px,2.4vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hc-kpi-ratio-root .p{font-size:15px;line-height:1.45;color:var(--soft)}
.hc-kpi-ratio-root .btn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;padding:13px 22px;border-radius:999px;text-decoration:none;border:0}
.hc-kpi-ratio-root .btn.ghost{background:transparent;border:1px solid var(--ink)}
.hc-kpi-ratio-root .link{font:500 13px var(--mono);color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
/* component */
.hc-kpi-ratio{max-width:980px;margin:0 auto}
.hc-kpi-ratio .wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
.hc-kpi-ratio .card{display:flex;flex-direction:column;gap:14px}
.hc-kpi-ratio .r{font-size:clamp(70px,14vw,150px);letter-spacing:-.06em;line-height:1;padding-bottom:14px}
.hc-kpi-ratio .r mark{padding:0 8px;background:linear-gradient(transparent 76%,var(--lime) 76%)}
.hc-kpi-ratio .u{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hc-kpi-ratio .u i{display:block;height:26px;border-radius:5px;background:var(--ink)}
.hc-kpi-ratio .u i.u1{background:var(--lime);border:1.5px solid var(--ink)}
.hc-kpi-ratio .ul{display:grid;grid-template-columns:1fr 6fr;gap:6px;font:500 11px/1.3 var(--mono);color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.hc-kpi-ratio .ul span:first-child{text-align:left}
.hc-kpi-ratio .side{display:flex;flex-direction:column;gap:16px}
.hc-kpi-ratio .side .card{flex:1;justify-content:center;gap:8px}
.hc-kpi-ratio .sv{font-size:clamp(34px,4.5vw,46px)}
.hc-kpi-ratio .sv small{font-size:.45em;font-weight:700;letter-spacing:-.01em;color:var(--soft)}
.hc-kpi-ratio .card.dark .sv small{color:#C9C7B8}
.hc-kpi-ratio .nt{font:500 12px/1.35 var(--mono);color:var(--muted)}
@media(max-width:760px){.hc-kpi-ratio .wrap{grid-template-columns:1fr}.hc-kpi-ratio .side{flex-direction:row;flex-wrap:wrap}.hc-kpi-ratio .side .card{min-width:150px}}
</style>
<div class="hc-kpi-ratio-root">
<div class="hc-kpi-ratio"><div class="wrap">
<div class="card"><span class="eyebrow">софт : услуги · пример данных</span>
<div class="r num"><mark>1&nbsp;:&nbsp;6</mark></div>
<div class="u" role="img" aria-label="Семь делений: одно – софт, шесть – услуги"><i class="u1"></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="ul"><span>софт</span><span>услуги</span></div>
<div class="nt">условная оценка, не статистика</div></div>
<div class="side">
<div class="card"><span class="eyebrow">софт в год</span><div class="sv num">$10&nbsp;<small>тыс.</small></div></div>
<div class="card dark"><span class="eyebrow">специалист в год</span><div class="sv num">$120&nbsp;<small>тыс.</small></div></div>
</div></div></div>
</div>
