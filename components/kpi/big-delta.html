<style>
/* tokens + base, scoped to this component only */
.hc-kpi-big-delta-root{--bg:#FAF8F2;--paper:#FFFEFA;--line:#D8D7C9;--ink:#24251E;--soft:#4F5147;--muted:#5C6053;
--lime:#D4FF00;--dark:#15150F;--grey:#8A8D7E;--sand:#E9E7DA;--sand2:#C9C8B8;
--sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
.hc-kpi-big-delta-root,.hc-kpi-big-delta-root *{box-sizing:border-box}
.hc-kpi-big-delta-root{font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;min-width:0}
.hc-kpi-big-delta-root *{min-width:0}
.hc-kpi-big-delta-root svg{max-width:100%;height:auto}
.hc-kpi-big-delta-root .mono{font-family:var(--mono)}
.hc-kpi-big-delta-root .eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hc-kpi-big-delta-root mark,.hc-kpi-big-delta-root .hl{background:linear-gradient(transparent 62%,var(--lime) 62%);color:inherit;padding:0 2px}
.hc-kpi-big-delta-root .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(10,10,10,.06);padding:24px}
.hc-kpi-big-delta-root .card.dark{background:var(--dark);border-color:var(--dark);color:var(--bg);box-shadow:0 14px 40px rgba(10,10,10,.18)}
.hc-kpi-big-delta-root .card.dark .eyebrow{color:#C9C7B8}
.hc-kpi-big-delta-root .tag{display:inline-block;background:var(--lime);color:var(--ink);font:600 11px/1 var(--mono);letter-spacing:.05em;padding:6px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.hc-kpi-big-delta-root .tag.line{background:transparent;border:1px solid var(--grey);color:var(--soft)}
.hc-kpi-big-delta-root .tag.dk{background:var(--ink);color:var(--lime)}
.hc-kpi-big-delta-root .num{font-weight:800;letter-spacing:-.04em;line-height:.95}
.hc-kpi-big-delta-root .h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hc-kpi-big-delta-root .h3{font-size:clamp(18px,2.4vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hc-kpi-big-delta-root .p{font-size:15px;line-height:1.45;color:var(--soft)}
.hc-kpi-big-delta-root .btn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;padding:13px 22px;border-radius:999px;text-decoration:none;border:0}
.hc-kpi-big-delta-root .btn.ghost{background:transparent;border:1px solid var(--ink)}
.hc-kpi-big-delta-root .link{font:500 13px var(--mono);color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
/* component */
.hc-kpi-big-delta{max-width:760px;margin:0 auto}
.hc-kpi-big-delta .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.hc-kpi-big-delta .big{font-size:clamp(52px,11vw,104px);margin:18px 0 10px}
.hc-kpi-big-delta .big mark{padding:0 6px}
.hc-kpi-big-delta .p{max-width:560px}
.hc-kpi-big-delta .delta{display:inline-flex;align-items:flex-start;gap:8px;margin:18px 0 20px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font:500 13px/1.3 var(--mono);color:var(--ink)}
.hc-kpi-big-delta .delta svg{flex:none;margin-top:1px}
.hc-kpi-big-delta .bar{position:relative;height:10px;border-radius:5px;background:var(--sand)}
.hc-kpi-big-delta .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink)}
.hc-kpi-big-delta .bar b{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--lime);border:2px solid var(--ink)}
.hc-kpi-big-delta .leg{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;font:500 12px/1.3 var(--mono);color:var(--soft)}
.hc-kpi-big-delta .leg span{display:inline-flex;align-items:center;gap:8px}
.hc-kpi-big-delta .leg em{display:inline-block;width:12px;height:8px;border-radius:2px;background:var(--ink)}
.hc-kpi-big-delta .leg em.o{background:var(--sand);border:1px solid var(--sand2)}
.hc-kpi-big-delta .src{margin-top:16px;font:500 11px/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media(max-width:520px){.hc-kpi-big-delta .delta{border-radius:16px}}
