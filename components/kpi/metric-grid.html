.hc-kpi-metric-grid-root,.hc-kpi-metric-grid-root *{box-sizing:border-box}

.hc-kpi-metric-grid-root .tag.dk{background:var(--ink);color:var(--lime)}
.hc-kpi-metric-grid-root .num{font-weight:800;letter-spacing:-.04em;line-height:.95}
.hc-kpi-metric-grid-root .h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hc-kpi-metric-grid-root .h3{font-size:clamp(18px,2.4vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hc-kpi-metric-grid-root .p{font-size:15px;line-height:1.45;color:var(--soft)}
.hc-kpi-metric-grid-root .btn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;padding:13px 22px;border-radius:999px;text-decoration:none;border:0}
.hc-kpi-metric-grid-root .btn.ghost{background:transparent;border:1px solid var(--ink)}
.hc-kpi-metric-grid-root .link{font:500 13px var(--mono);color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
/* component */
.hc-kpi-metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.hc-kpi-metric-grid .card{display:flex;flex-direction:column;gap:10px;padding:20px}
.hc-kpi-metric-grid .v{font-size:clamp(34px,4.4vw,46px)}
.hc-kpi-metric-grid .v small{font-size:.5em;letter-spacing:-.02em;font-weight:700}
.hc-kpi-metric-grid .cap{font:500 11px/1.35 var(--mono);color:var(--muted);margin-top:auto}
.hc-kpi-metric-grid .card.dark .cap{color:#C9C7B8}
.hc-kpi-metric-grid .bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:6px}
.hc-kpi-metric-grid .bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.hc-kpi-metric-grid .bc i{display:block;width:100%;border-radius:4px 4px 0 0;background:#6E7063}
.hc-kpi-metric-grid .bc i.mx{background:var(--lime)}
.hc-kpi-metric-grid .bc span{font:500 11px/1 var(--mono);color:#C9C7B8}
.hc-kpi-metric-grid .sq{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.hc-kpi-metric-grid .sq i{width:14px;height:14px;border-radius:4px;background:var(--ink)}
.hc-kpi-metric-grid .sq i.o{background:transparent;border:1.5px solid var(--sand2)}
.hc-kpi-metric-grid .sq.dt i{border-radius:50%}
.hc-kpi-metric-grid .track{height:8px;border-radius:4px;background:var(--sand);margin-top:14px}
.hc-kpi-metric-grid .track i{display:block;height:100%;border-radius:4px;background:var(--ink)}
