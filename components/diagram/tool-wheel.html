<style>
/* tokens + base, scoped to this component only */
.hc-diagram-tool-wheel-root{--bg:#FAF8F2;--paper:#FFFEFA;--line:#D8D7C9;--ink:#24251E;--soft:#4F5147;--muted:#5C6053;
--lime:#D4FF00;--dark:#15150F;--grey:#8A8D7E;--sand:#E9E7DA;--sand2:#C9C8B8;
--sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
.hc-diagram-tool-wheel-root,.hc-diagram-tool-wheel-root *{box-sizing:border-box}
.hc-diagram-tool-wheel-root{font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;min-width:0}
.hc-diagram-tool-wheel-root *{min-width:0}
.hc-diagram-tool-wheel-root svg{max-width:100%;height:auto}
.hc-diagram-tool-wheel-root .mono{font-family:var(--mono)}
.hc-diagram-tool-wheel-root .eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hc-diagram-tool-wheel-root mark,.hc-diagram-tool-wheel-root .hl{background:linear-gradient(transparent 62%,var(--lime) 62%);color:inherit;padding:0 2px}
.hc-diagram-tool-wheel-root .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(10,10,10,.06);padding:24px}
.hc-diagram-tool-wheel-root .card.dark{background:var(--dark);border-color:var(--dark);color:var(--bg);box-shadow:0 14px 40px rgba(10,10,10,.18)}
.hc-diagram-tool-wheel-root .card.dark .eyebrow{color:#C9C7B8}
.hc-diagram-tool-wheel-root .tag{display:inline-block;background:var(--lime);color:var(--ink);font:600 11px/1 var(--mono);letter-spacing:.05em;padding:6px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.hc-diagram-tool-wheel-root .tag.line{background:transparent;border:1px solid var(--grey);color:var(--soft)}
.hc-diagram-tool-wheel-root .tag.dk{background:var(--ink);color:var(--lime)}
.hc-diagram-tool-wheel-root .num{font-weight:800;letter-spacing:-.04em;line-height:.95}
.hc-diagram-tool-wheel-root .h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hc-diagram-tool-wheel-root .h3{font-size:clamp(18px,2.4vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hc-diagram-tool-wheel-root .p{font-size:15px;line-height:1.45;color:var(--soft)}
.hc-diagram-tool-wheel-root .btn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;padding:13px 22px;border-radius:999px;text-decoration:none;border:0}
.hc-diagram-tool-wheel-root .btn.ghost{background:transparent;border:1px solid var(--ink)}
.hc-diagram-tool-wheel-root .link{font:500 13px var(--mono);color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
/* component */
.hc-diagram-tool-wheel{max-width:640px;margin:0 auto}
.hc-diagram-tool-wheel .card{padding:20px}
.hc-diagram-tool-wheel .box{position:relative;width:100%;max-width:520px;aspect-ratio:1;margin:0 auto}
.hc-diagram-tool-wheel .ringl{position:absolute;inset:10%;border:1px solid var(--sand2);border-radius:50%}
.hc-diagram-tool-wheel .sp{position:absolute;inset:0;width:100%;height:100%}
.hc-diagram-tool-wheel .hub{position:absolute;left:50%;top:50%;width:28%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--dark);color:var(--bg);display:grid;place-items:center;text-align:center;font-weight:800;letter-spacing:-.03em;font-size:clamp(15px,3.6vw,24px);box-shadow:0 10px 30px rgba(10,10,10,.2)}
.hc-diagram-tool-wheel .hub::after{content:"";position:absolute;left:50%;bottom:16%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--lime)}
.hc-diagram-tool-wheel .bg{position:absolute;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 6px 16px rgba(10,10,10,.06)}
.hc-diagram-tool-wheel .bg svg{height:46%!important;width:auto;max-width:62%}
.hc-diagram-tool-wheel .cap{margin-top:16px;text-align:center}
.hc-diagram-tool-wheel .cap .tag{margin-bottom:8px;white-space:normal;line-height:1.35}
.hc-diagram-tool-wheel .cap p{font:500 12px/1.5 var(--mono);color:var(--muted)}
@media(max-width:520px){.hc-diagram-tool-wheel .card{padding:14px}}
</style>
