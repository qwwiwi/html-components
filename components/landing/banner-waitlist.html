<style>
/* tokens + base, scoped to this component only */
.hc-landing-banner-waitlist-root{--bg:#FAF8F2;--paper:#FFFEFA;--line:#D8D7C9;--ink:#24251E;--soft:#4F5147;--muted:#5C6053;
--lime:#D4FF00;--dark:#15150F;--grey:#8A8D7E;--sand:#E9E7DA;--sand2:#C9C8B8;
--sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
.hc-landing-banner-waitlist-root,.hc-landing-banner-waitlist-root *{box-sizing:border-box}
.hc-landing-banner-waitlist-root{font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;min-width:0}
.hc-landing-banner-waitlist-root *{min-width:0}
.hc-landing-banner-waitlist-root svg{max-width:100%;height:auto}
.hc-landing-banner-waitlist-root .mono{font-family:var(--mono)}
.hc-landing-banner-waitlist-root .eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hc-landing-banner-waitlist-root mark,.hc-landing-banner-waitlist-root .hl{background:linear-gradient(transparent 62%,var(--lime) 62%);color:inherit;padding:0 2px}
.hc-landing-banner-waitlist-root .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(10,10,10,.06);padding:24px}
.hc-landing-banner-waitlist-root .card.dark{background:var(--dark);border-color:var(--dark);color:var(--bg);box-shadow:0 14px 40px rgba(10,10,10,.18)}
.hc-landing-banner-waitlist-root .card.dark .eyebrow{color:#C9C7B8}
.hc-landing-banner-waitlist-root .tag{display:inline-block;background:var(--lime);color:var(--ink);font:600 11px/1 var(--mono);letter-spacing:.05em;padding:6px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.hc-landing-banner-waitlist-root .tag.line{background:transparent;border:1px solid var(--grey);color:var(--soft)}
.hc-landing-banner-waitlist-root .tag.dk{background:var(--ink);color:var(--lime)}
.hc-landing-banner-waitlist-root .num{font-weight:800;letter-spacing:-.04em;line-height:.95}
.hc-landing-banner-waitlist-root .h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hc-landing-banner-waitlist-root .h3{font-size:clamp(18px,2.4vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hc-landing-banner-waitlist-root .p{font-size:15px;line-height:1.45;color:var(--soft)}
.hc-landing-banner-waitlist-root .btn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;padding:13px 22px;border-radius:999px;text-decoration:none;border:0}
.hc-landing-banner-waitlist-root .btn.ghost{background:transparent;border:1px solid var(--ink)}
.hc-landing-banner-waitlist-root .link{font:500 13px var(--mono);color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
/* component */
.hc-landing-banner-waitlist{display:grid;gap:14px}
.hc-landing-banner-waitlist .bn{display:flex;gap:12px 18px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 18px;border-radius:14px;font-size:15px}
.hc-landing-banner-waitlist .bn .m{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.hc-landing-banner-waitlist .bn b{letter-spacing:-.01em}
.hc-landing-banner-waitlist .b1{background:var(--lime);color:var(--ink)}
.hc-landing-banner-waitlist .b1 .dot{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.hc-landing-banner-waitlist .b1 a{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.hc-landing-banner-waitlist .b2{background:var(--dark);color:var(--bg)}
.hc-landing-banner-waitlist .b2 .tag{background:var(--lime)}
.hc-landing-banner-waitlist .b2 a{color:var(--lime);font-weight:700}
.hc-landing-banner-waitlist .wl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 14px 40px rgba(10,10,10,.05)}
.hc-landing-banner-waitlist .wl .cnt{display:flex;gap:14px;align-items:center}
.hc-landing-banner-waitlist .wl .cnt .num{font-size:44px}
.hc-landing-banner-waitlist .wl .cnt span.d{font-size:14px;color:var(--soft);line-height:1.35}
.hc-landing-banner-waitlist .wl .f{display:flex;gap:8px;flex-wrap:wrap}
.hc-landing-banner-waitlist .wl .inp{border:1px solid var(--line);border-radius:999px;padding:12px 18px;min-width:210px;color:var(--muted);background:var(--bg);font-size:15px}
.hc-landing-banner-waitlist .note{font-size:12.5px;color:var(--muted)}
@media(max-width:640px){.hc-landing-banner-waitlist .wl{grid-template-columns:1fr}.hc-landing-banner-waitlist .wl .inp{min-width:0;flex:1 1 180px}}
</style>
<div class="hc-landing-banner-waitlist-root">
<div class="hc-landing-banner-waitlist">
<div class="bn b1"><div class="m"><span class="dot"></span><b>Запуск откроется на следующей неделе.</b><span>Пока можно оставить заявку.</span></div><a>Оставить заявку →</a></div>
<div class="bn b2"><div class="m"><span class="tag">Сообщество</span><span>Два пути: сократить расходы своего бизнеса или заработать на новом продукте</span></div><a>Подробнее →</a></div>
<div class="wl"><div class="cnt"><span class="num">120</span><span class="d">человек в списке ожидания<br><span class="note">пример данных</span></span></div>
<div class="f"><span class="inp">Эл. почта: name@example.com</span><a class="btn">Записаться</a></div></div>
</div>
</div>
