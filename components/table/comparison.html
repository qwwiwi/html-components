  data_slots: шапка колонок, подписи строк, значения ячеек, выделенная колонка (class ft)
  source: 21st.dev #26827 «Comparison Table», автор mohammadshehadeh

  class prefix: hc-table-comparison (unique; do not rename)
  how to use: copy this whole file into the page, replace the demo data; fonts optional (fonts.css).

<style>
/* tokens + base, scoped to this component only */
.hc-table-comparison-root{--bg:#FAF8F2;--paper:#FFFEFA;--line:#D8D7C9;--ink:#24251E;--soft:#4F5147;--muted:#5C6053;
--lime:#D4FF00;--dark:#15150F;--grey:#8A8D7E;--sand:#E9E7DA;--sand2:#C9C8B8;
--sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
.hc-table-comparison-root,.hc-table-comparison-root *{box-sizing:border-box}
.hc-table-comparison-root{font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;min-width:0}
.hc-table-comparison-root *{min-width:0}
.hc-table-comparison-root svg{max-width:100%;height:auto}
.hc-table-comparison-root .mono{font-family:var(--mono)}
.hc-table-comparison-root .eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hc-table-comparison-root mark,.hc-table-comparison-root .hl{background:linear-gradient(transparent 62%,var(--lime) 62%);color:inherit;padding:0 2px}
.hc-table-comparison-root .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(10,10,10,.06);padding:24px}
.hc-table-comparison-root .card.dark{background:var(--dark);border-color:var(--dark);color:var(--bg);box-shadow:0 14px 40px rgba(10,10,10,.18)}
.hc-table-comparison-root .card.dark .eyebrow{color:#C9C7B8}
.hc-table-comparison-root .tag{display:inline-block;background:var(--lime);color:var(--ink);font:600 11px/1 var(--mono);letter-spacing:.05em;padding:6px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.hc-table-comparison-root .tag.line{background:transparent;border:1px solid var(--grey);color:var(--soft)}
.hc-table-comparison-root .tag.dk{background:var(--ink);color:var(--lime)}
.hc-table-comparison-root .num{font-weight:800;letter-spacing:-.04em;line-height:.95}
.hc-table-comparison-root .h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hc-table-comparison-root .h3{font-size:clamp(18px,2.4vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hc-table-comparison-root .p{font-size:15px;line-height:1.45;color:var(--soft)}
.hc-table-comparison-root .btn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;padding:13px 22px;border-radius:999px;text-decoration:none;border:0}
.hc-table-comparison-root .btn.ghost{background:transparent;border:1px solid var(--ink)}
.hc-table-comparison-root .link{font:500 13px var(--mono);color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
/* component */
.hc-table-comparison{max-width:980px;margin:0 auto}
.hc-table-comparison table{width:100%;border-collapse:separate;border-spacing:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.hc-table-comparison th,.hc-table-comparison td{padding:16px 18px;text-align:left;vertical-align:top;font-size:15px;line-height:1.35;border-bottom:1px solid var(--line)}
.hc-table-comparison tr:last-child td{border-bottom:0}
.hc-table-comparison th{font-weight:700;font-size:17px;letter-spacing:-.01em}
.hc-table-comparison th .cap{display:block;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hc-table-comparison td.k{font:600 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);width:20%}
.hc-table-comparison .ft{background:var(--dark);color:var(--bg)}
.hc-table-comparison th.ft .cap{color:#C9C7B8}
.hc-table-comparison td.ft b{background:linear-gradient(transparent 62%,rgba(212,255,0,.55) 62%)}
@media(max-width:640px){
.hc-table-comparison table,.hc-table-comparison tbody,.hc-table-comparison tr,.hc-table-comparison td,.hc-table-comparison th{display:block;width:auto}
.hc-table-comparison thead{display:none}
.hc-table-comparison tr{padding:12px 4px;border-bottom:1px solid var(--line)}
.hc-table-comparison tr:last-child{border-bottom:0}
.hc-table-comparison td{border:0;padding:6px 14px}
.hc-table-comparison td.k{width:auto;font-size:13px;color:var(--ink)}
.hc-table-comparison td[data-l]::before{content:attr(data-l);display:block;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.hc-table-comparison td.ft{border-radius:10px;margin:2px 8px}
.hc-table-comparison td.ft::before{color:#C9C7B8}}
</style>
<div class="hc-table-comparison-root">
<div class="hc-table-comparison"><table>
<thead><tr><th></th><th><span class="cap">Раньше</span>Вариант 1</th><th><span class="cap">Сейчас</span>Вариант 2</th><th class="ft"><span class="cap">Прогноз</span>Вариант 3</th></tr></thead>
<tbody>
<tr><td class="k">Срок внедрения</td><td data-l="Раньше">около 5 лет</td><td data-l="Сейчас">квартал-два</td><td class="ft" data-l="Прогноз"><b>несколько недель</b></td></tr>
<tr><td class="k">Команда</td><td data-l="Раньше">отдел из 10 человек</td><td data-l="Сейчас">3–4 специалиста</td><td class="ft" data-l="Прогноз"><b>один владелец и агенты</b></td></tr>
<tr><td class="k">Стоимость</td><td data-l="Раньше">высокая, фиксированная</td><td data-l="Сейчас">средняя, по подписке</td><td class="ft" data-l="Прогноз"><b>оплата за результат</b></td></tr>
</tbody></table></div>
</div>
