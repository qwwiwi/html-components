<style>
/* tokens + base, scoped to this component only */
.hc-data-partition-bar-root{--bg:#FAF8F2;--paper:#FFFEFA;--line:#D8D7C9;--ink:#24251E;--soft:#4F5147;--muted:#5C6053;
--lime:#D4FF00;--dark:#15150F;--grey:#8A8D7E;--sand:#E9E7DA;--sand2:#C9C8B8;
--sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
.hc-data-partition-bar-root,.hc-data-partition-bar-root *{box-sizing:border-box}
.hc-data-partition-bar-root{font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;min-width:0}
.hc-data-partition-bar-root *{min-width:0}
.hc-data-partition-bar-root svg{max-width:100%;height:auto}
.hc-data-partition-bar-root .mono{font-family:var(--mono)}
.hc-data-partition-bar-root .eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hc-data-partition-bar-root mark,.hc-data-partition-bar-root .hl{background:linear-gradient(transparent 62%,var(--lime) 62%);color:inherit;padding:0 2px}
.hc-data-partition-bar-root .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(10,10,10,.06);padding:24px}
.hc-data-partition-bar-root .card.dark{background:var(--dark);border-color:var(--dark);color:var(--bg);box-shadow:0 14px 40px rgba(10,10,10,.18)}
.hc-data-partition-bar-root .card.dark .eyebrow{color:#C9C7B8}
.hc-data-partition-bar-root .tag{display:inline-block;background:var(--lime);color:var(--ink);font:600 11px/1 var(--mono);letter-spacing:.05em;padding:6px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.hc-data-partition-bar-root .tag.line{background:transparent;border:1px solid var(--grey);color:var(--soft)}
.hc-data-partition-bar-root .tag.dk{background:var(--ink);color:var(--lime)}
.hc-data-partition-bar-root .num{font-weight:800;letter-spacing:-.04em;line-height:.95}
.hc-data-partition-bar-root .h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hc-data-partition-bar-root .h3{font-size:clamp(18px,2.4vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hc-data-partition-bar-root .p{font-size:15px;line-height:1.45;color:var(--soft)}
.hc-data-partition-bar-root .btn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;padding:13px 22px;border-radius:999px;text-decoration:none;border:0}
.hc-data-partition-bar-root .btn.ghost{background:transparent;border:1px solid var(--ink)}
.hc-data-partition-bar-root .link{font:500 13px var(--mono);color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
/* component */
.hc-data-partition-bar{max-width:900px;margin:0 auto}
.hc-data-partition-bar .pb{display:flex;height:44px;border-radius:12px;overflow:hidden;margin:16px 0 18px;border:1px solid var(--line)}
.hc-data-partition-bar .pb i{display:block;min-width:2px}
.hc-data-partition-bar .lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;font-size:14px}
.hc-data-partition-bar .lg div{display:flex;align-items:center;gap:8px}
.hc-data-partition-bar .lg em{display:block;flex:none;width:14px;height:14px;border-radius:4px}
.hc-data-partition-bar .lg b{font-family:var(--mono);margin-right:4px}
.hc-data-partition-bar .nt{margin-top:16px;font:500 12px/1.4 var(--mono);color:var(--muted)}
</style>
<div class="hc-data-partition-bar-root">
<div class="hc-data-partition-bar"><div class="card">
<span class="eyebrow">Структура · 201 позиция</span>
<div class="pb" role="img" aria-label="Доли категорий одной полосой, всего 201"><i style="flex:98;background:#24251E"></i><i style="flex:10;background:#4F5147"></i><i style="flex:9;background:#6E7163"></i><i style="flex:9;background:#8A8D7E"></i><i style="flex:8;background:#A9AC9C"></i><i style="flex:51;background:#C9CABB"></i><i style="flex:16;background:#E3E1D3"></i></div>
<div class="lg"><div><em style="background:#24251E"></em><span><b>98</b> Категория А</span></div><div><em style="background:#4F5147"></em><span><b>10</b> Категория Б</span></div><div><em style="background:#6E7163"></em><span><b>9</b> Категория В</span></div><div><em style="background:#8A8D7E"></em><span><b>9</b> Категория Г</span></div><div><em style="background:#A9AC9C"></em><span><b>8</b> Категория Д</span></div><div><em style="background:#C9CABB"></em><span><b>51</b> Остальные</span></div><div><em style="background:#E3E1D3"></em><span><b>16</b> Не указана</span></div><div><em style="background:var(--lime);border:2px solid var(--ink)"></em><span><b>0</b> Категория Ж</span></div></div>
<div class="nt">пример данных</div></div></div>
</div>
