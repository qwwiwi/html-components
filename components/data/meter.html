<style>
/* tokens + base, scoped to this component only */
.hc-data-meter-root{--bg:#FAF8F2;--paper:#FFFEFA;--line:#D8D7C9;--ink:#24251E;--soft:#4F5147;--muted:#5C6053;
--lime:#D4FF00;--dark:#15150F;--grey:#8A8D7E;--sand:#E9E7DA;--sand2:#C9C8B8;
--sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
.hc-data-meter-root,.hc-data-meter-root *{box-sizing:border-box}
.hc-data-meter-root{font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;min-width:0}
.hc-data-meter-root *{min-width:0}
.hc-data-meter-root svg{max-width:100%;height:auto}
.hc-data-meter-root .mono{font-family:var(--mono)}
.hc-data-meter-root .eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hc-data-meter-root mark,.hc-data-meter-root .hl{background:linear-gradient(transparent 62%,var(--lime) 62%);color:inherit;padding:0 2px}
.hc-data-meter-root .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(10,10,10,.06);padding:24px}
.hc-data-meter-root .card.dark{background:var(--dark);border-color:var(--dark);color:var(--bg);box-shadow:0 14px 40px rgba(10,10,10,.18)}
.hc-data-meter-root .card.dark .eyebrow{color:#C9C7B8}
.hc-data-meter-root .tag{display:inline-block;background:var(--lime);color:var(--ink);font:600 11px/1 var(--mono);letter-spacing:.05em;padding:6px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.hc-data-meter-root .tag.line{background:transparent;border:1px solid var(--grey);color:var(--soft)}
.hc-data-meter-root .tag.dk{background:var(--ink);color:var(--lime)}
.hc-data-meter-root .num{font-weight:800;letter-spacing:-.04em;line-height:.95}
.hc-data-meter-root .h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hc-data-meter-root .h3{font-size:clamp(18px,2.4vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hc-data-meter-root .p{font-size:15px;line-height:1.45;color:var(--soft)}
.hc-data-meter-root .btn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;padding:13px 22px;border-radius:999px;text-decoration:none;border:0}
.hc-data-meter-root .btn.ghost{background:transparent;border:1px solid var(--ink)}
.hc-data-meter-root .link{font:500 13px var(--mono);color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
/* component */
.hc-data-meter{max-width:760px;margin:0 auto}
.hc-data-meter .card{display:flex;flex-direction:column;gap:26px}
.hc-data-meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
.hc-data-meter .lb{font-size:16px;font-weight:600}
.hc-data-meter .vv{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1}
.hc-data-meter .tr{height:18px;border-radius:999px;background:var(--sand);margin-top:10px;overflow:hidden;border:1px solid var(--line)}
.hc-data-meter .fl{height:100%;border-radius:999px;background:var(--ink)}
.hc-data-meter .fl.lime{background:var(--lime);box-shadow:inset 0 0 0 1px #BFE600;min-width:10px}
</style>
<div class="hc-data-meter-root">
<div class="hc-data-meter"><div class="card">
<div class="m"><div class="top"><span class="lb">Используют сейчас <span class="tag line">оценка</span></span><span class="vv">меньше 1%</span></div><div class="tr"><div class="fl lime" style="width:1%"></div></div></div>
<div class="m"><div class="top"><span class="lb">Придут позднее <span class="tag line">оценка</span></span><span class="vv">около 90%</span></div><div class="tr"><div class="fl" style="width:90%"></div></div></div>
</div></div>
</div>
