<style>
/* tokens + base, scoped to this component only */
.hc-data-bar-vertical-root{--bg:#FAF8F2;--paper:#FFFEFA;--line:#D8D7C9;--ink:#24251E;--soft:#4F5147;--muted:#5C6053;
--lime:#D4FF00;--dark:#15150F;--grey:#8A8D7E;--sand:#E9E7DA;--sand2:#C9C8B8;
--sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
.hc-data-bar-vertical-root,.hc-data-bar-vertical-root *{box-sizing:border-box}
.hc-data-bar-vertical-root{font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;min-width:0}
.hc-data-bar-vertical-root *{min-width:0}
.hc-data-bar-vertical-root svg{max-width:100%;height:auto}
.hc-data-bar-vertical-root .mono{font-family:var(--mono)}
.hc-data-bar-vertical-root .eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hc-data-bar-vertical-root mark,.hc-data-bar-vertical-root .hl{background:linear-gradient(transparent 62%,var(--lime) 62%);color:inherit;padding:0 2px}
.hc-data-bar-vertical-root .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(10,10,10,.06);padding:24px}
.hc-data-bar-vertical-root .card.dark{background:var(--dark);border-color:var(--dark);color:var(--bg);box-shadow:0 14px 40px rgba(10,10,10,.18)}
.hc-data-bar-vertical-root .card.dark .eyebrow{color:#C9C7B8}
.hc-data-bar-vertical-root .tag{display:inline-block;background:var(--lime);color:var(--ink);font:600 11px/1 var(--mono);letter-spacing:.05em;padding:6px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.hc-data-bar-vertical-root .tag.line{background:transparent;border:1px solid var(--grey);color:var(--soft)}
.hc-data-bar-vertical-root .tag.dk{background:var(--ink);color:var(--lime)}
.hc-data-bar-vertical-root .num{font-weight:800;letter-spacing:-.04em;line-height:.95}
.hc-data-bar-vertical-root .h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hc-data-bar-vertical-root .h3{font-size:clamp(18px,2.4vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hc-data-bar-vertical-root .p{font-size:15px;line-height:1.45;color:var(--soft)}
.hc-data-bar-vertical-root .btn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;padding:13px 22px;border-radius:999px;text-decoration:none;border:0}
.hc-data-bar-vertical-root .btn.ghost{background:transparent;border:1px solid var(--ink)}
.hc-data-bar-vertical-root .link{font:500 13px var(--mono);color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
/* component */
.hc-data-bar-vertical{max-width:820px;margin:0 auto}
.hc-data-bar-vertical .card{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:end}
.hc-data-bar-vertical .vb{display:flex;align-items:flex-end;gap:clamp(24px,6vw,64px);height:300px;padding-bottom:28px;position:relative;border-bottom:2px solid var(--ink)}
.hc-data-bar-vertical .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;flex:1;height:100%;position:relative}
.hc-data-bar-vertical .vl{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.03em}
.hc-data-bar-vertical .b{width:100%;max-width:90px;border-radius:10px 10px 0 0;background:var(--sand2)}
.hc-data-bar-vertical .b.ink{background:var(--ink)}
.hc-data-bar-vertical .nm{position:absolute;bottom:-28px;font:500 13px var(--mono);color:var(--muted)}
.hc-data-bar-vertical .big{font-size:clamp(24px,3.6vw,36px);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:16px}
@media(max-width:560px){.hc-data-bar-vertical .card{grid-template-columns:1fr}.hc-data-bar-vertical .vb{height:240px}}

<div class="hc-data-bar-vertical-root">
<div class="hc-data-bar-vertical"><div class="card">
<div class="vb"><div class="c"><div class="vl">$1</div><div class="b" style="height:36px"></div><span class="nm">продукт</span></div><div class="c"><div class="vl">$6</div><div class="b ink" style="height:190px"></div><span class="nm">услуги</span></div></div>
<div><span class="tag">пример данных</span><div class="big">На $1 продукта приходится $6 услуг</div></div>
</div></div>
