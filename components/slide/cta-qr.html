<style>
/* tokens + base, scoped to this component only */
.hc-slide-cta-qr-root{--bg:#FAF8F2;--paper:#FFFEFA;--line:#D8D7C9;--ink:#24251E;--soft:#4F5147;--muted:#5C6053;
--lime:#D4FF00;--dark:#15150F;--grey:#8A8D7E;--sand:#E9E7DA;--sand2:#C9C8B8;
--sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
.hc-slide-cta-qr-root,.hc-slide-cta-qr-root *{box-sizing:border-box}
.hc-slide-cta-qr-root{font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;min-width:0}
.hc-slide-cta-qr-root *{min-width:0}
.hc-slide-cta-qr-root svg{max-width:100%;height:auto}
.hc-slide-cta-qr-root .mono{font-family:var(--mono)}
.hc-slide-cta-qr-root .eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hc-slide-cta-qr-root mark,.hc-slide-cta-qr-root .hl{background:linear-gradient(transparent 62%,var(--lime) 62%);color:inherit;padding:0 2px}
.hc-slide-cta-qr-root .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(10,10,10,.06);padding:24px}
.hc-slide-cta-qr-root .card.dark{background:var(--dark);border-color:var(--dark);color:var(--bg);box-shadow:0 14px 40px rgba(10,10,10,.18)}
.hc-slide-cta-qr-root .card.dark .eyebrow{color:#C9C7B8}
.hc-slide-cta-qr-root .tag{display:inline-block;background:var(--lime);color:var(--ink);font:600 11px/1 var(--mono);letter-spacing:.05em;padding:6px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.hc-slide-cta-qr-root .tag.line{background:transparent;border:1px solid var(--grey);color:var(--soft)}
.hc-slide-cta-qr-root .tag.dk{background:var(--ink);color:var(--lime)}
.hc-slide-cta-qr-root .num{font-weight:800;letter-spacing:-.04em;line-height:.95}
.hc-slide-cta-qr-root .h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hc-slide-cta-qr-root .h3{font-size:clamp(18px,2.4vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hc-slide-cta-qr-root .p{font-size:15px;line-height:1.45;color:var(--soft)}
.hc-slide-cta-qr-root .btn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;padding:13px 22px;border-radius:999px;text-decoration:none;border:0}
.hc-slide-cta-qr-root .btn.ghost{background:transparent;border:1px solid var(--ink)}
.hc-slide-cta-qr-root .link{font:500 13px var(--mono);color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
/* component */
.hc-slide-cta-qr{max-width:1000px;margin:0 auto}
.hc-slide-cta-qr .card{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(22px,4vw,48px);align-items:center;padding:clamp(22px,4vw,44px)}
.hc-slide-cta-qr .l{display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.hc-slide-cta-qr .tag{align-self:flex-start}
.hc-slide-cta-qr h2{margin:0;font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.hc-slide-cta-qr .btn{white-space:normal;text-align:center}
.hc-slide-cta-qr .lk{display:flex;flex-wrap:wrap;gap:6px 18px}
.hc-slide-cta-qr .lk a{font:500 14px var(--mono);color:var(--bg);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:4px;overflow-wrap:anywhere}
.hc-slide-cta-qr .q{margin:0;font:500 12px/1.4 var(--mono);letter-spacing:.03em;color:#C9C7B8}
.hc-slide-cta-qr .r{display:flex;justify-content:center}
.hc-slide-cta-qr .qc{width:100%;max-width:240px;background:#FFFEFA;color:var(--ink);border-radius:18px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.hc-slide-cta-qr .qc .qrw{width:100%;max-width:200px;min-width:150px}
.hc-slide-cta-qr .qc p{margin:0;font-size:13px;line-height:1.3;font-weight:600;letter-spacing:-.005em}
@media(max-width:720px){.hc-slide-cta-qr .card{grid-template-columns:minmax(0,1fr)}.hc-slide-cta-qr .btn{display:block;width:100%}}
</style>
