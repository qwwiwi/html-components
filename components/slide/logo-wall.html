/* tokens + base, scoped to this component only */

--sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}

.hc-slide-logo-wall-root .tag.line{background:transparent;border:1px solid var(--grey);color:var(--soft)}

.hc-slide-logo-wall-root .h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}

.hc-slide-logo-wall-root .btn.ghost{background:transparent;border:1px solid var(--ink)}
.hc-slide-logo-wall-root .link{font:500 13px var(--mono);color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
/* component */
.hc-slide-logo-wall{max-width:1100px;margin:0 auto}
.hc-slide-logo-wall .wall{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 40px rgba(10,10,10,.06)}
.hc-slide-logo-wall .c{background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 8px 22px;min-height:132px}
.hc-slide-logo-wall .c svg{max-width:80% !important;max-height:32px;filter:grayscale(1) brightness(.5) !important;opacity:1 !important}
.hc-slide-logo-wall .nm{font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere;text-align:center}
.hc-slide-logo-wall .cap{margin:14px 2px 0;font:500 12px/1.45 var(--mono);letter-spacing:.03em;color:var(--muted)}
@media(max-width:820px){.hc-slide-logo-wall .wall{grid-template-columns:repeat(3,minmax(0,1fr))}.hc-slide-logo-wall .c{min-height:112px;padding:24px 6px 18px}}
