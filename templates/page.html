.hc-kpi-stat-trio-root .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(10,10,10,.06);padding:24px}
.hc-kpi-stat-trio-root .card.dark{background:var(--dark);border-color:var(--dark);color:var(--bg);box-shadow:0 14px 40px rgba(10,10,10,.18)}
.hc-kpi-stat-trio-root .card.dark .eyebrow{color:#C9C7B8}
.hc-kpi-stat-trio-root .tag{display:inline-block;background:var(--lime);color:var(--ink);font:600 11px/1 var(--mono);letter-spacing:.05em;padding:6px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.hc-kpi-stat-trio-root .tag.line{background:transparent;border:1px solid var(--grey);color:var(--soft)}
.hc-kpi-stat-trio-root .tag.dk{background:var(--ink);color:var(--lime)}
.hc-kpi-stat-trio-root .num{font-weight:800;letter-spacing:-.04em;line-height:.95}
.hc-kpi-stat-trio-root .h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hc-kpi-stat-trio-root .h3{font-size:clamp(18px,2.4vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hc-kpi-stat-trio-root .p{font-size:15px;line-height:1.45;color:var(--soft)}
.hc-kpi-stat-trio-root .btn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;padding:13px 22px;border-radius:999px;text-decoration:none;border:0}
.hc-kpi-stat-trio-root .btn.ghost{background:transparent;border:1px solid var(--ink)}
.hc-kpi-stat-trio-root .link{font:500 13px var(--mono);color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px}
/* component */
.hc-kpi-stat-trio{max-width:980px;margin:0 auto}
.hc-kpi-stat-trio .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.hc-kpi-stat-trio .card{display:flex;flex-direction:column;gap:10px;justify-content:space-between;min-height:150px}
.hc-kpi-stat-trio .v{font-size:clamp(48px,9vw,88px)}
.hc-kpi-stat-trio .card.zero{border:2px solid var(--ink)}
.hc-kpi-stat-trio .card.zero .v mark{background:linear-gradient(transparent 70%,var(--lime) 70%)}
.hc-kpi-stat-trio .nt{margin-top:12px;font:500 12px/1.4 var(--mono);color:var(--muted)}
@media(max-width:640px){.hc-kpi-stat-trio .g{grid-template-columns:1fr}.hc-kpi-stat-trio .card{min-height:0}}
</style>
<div class="hc-kpi-stat-trio-root">

</div><div class="nt">пример данных</div></div>
